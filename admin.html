<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELORA | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171514;
      color: #fff;
      padding: 20px;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
      text-align: center;
      margin: 20px 0 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: 7px;
    }

    .logo p {
      margin: 8px 0 0;
      color: #c9a96e;
      letter-spacing: 2px;
    }

    /* =========================
       BOX
    ========================= */

    .box {
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 20px;
    }

    /* =========================
       INPUTS
    ========================= */

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #4b4541;
      background: #171514;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #c9a96e;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* =========================
       BUTTONS
    ========================= */

    .primary {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
      border-radius: 10px;
    }

    .logout,
    .refresh,
    .cancel {
      background: #3b3633;
      color: #fff;
      padding: 11px 16px;
      border-radius: 10px;
    }

    .edit {
      background: #c9a96e;
      color: #171514;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: bold;
    }

    .delete {
      background: #6b2929;
      color: #fff;
      padding: 10px 14px;
      border-radius: 9px;
    }

    /* =========================
       STATUS
    ========================= */

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #302d2a;
      display: none;
      line-height: 1.7;
    }

    .status.show {
      display: block;
    }

    /* =========================
       TOP BAR
    ========================= */

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      margin: 0;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }

    .stat-number {
      display: block;
      font-size: 30px;
      font-weight: bold;
      color: #c9a96e;
      margin-bottom: 6px;
    }

    .stat-label {
      color: #aaa;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-box {
      margin-bottom: 20px;
    }

    .search-box input {
      padding: 15px;
    }

    /* =========================
       IMAGE PREVIEW
    ========================= */

    .image-preview-box {
      margin-top: 15px;
      text-align: center;
    }

    .image-preview {
      width: 220px;
      height: 220px;
      max-width: 100%;
      object-fit: cover;
      border-radius: 15px;
      border: 1px solid #3b3633;
      background: #171514;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .product {
      border-top: 1px solid #3b3633;
      padding: 18px 0;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product:first-child {
      border-top: 0;
    }

    .product img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 13px;
      background: #171514;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-info h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .product-price {
      color: #c9a96e;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .product-category {
      color: #aaa;
      font-size: 14px;
    }

    .product-description {
      color: #999;
      font-size: 13px;
      margin-top: 5px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #aaa;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 18px;
      padding: 25px;
      text-align: center;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons button {
      flex: 1;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      body {
        padding: 12px;
      }

      .box {
        padding: 18px;
      }

      .logo h1 {
        font-size: 30px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .product {
        align-items: flex-start;
      }

      .product img {
        width: 70px;
        height: 70px;
      }

      .product {
        flex-wrap: wrap;
      }

      .product-info {
        min-width: calc(100% - 90px);
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .top-bar {
        align-items: flex-start;
      }

      .top-bar h2 {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>

<div class="container">


  <!-- LOGO -->

  <div class="logo">

    <h1>VELORA</h1>

    <p>ADMIN PANEL</p>

  </div>


  <!-- LOGIN -->

  <div
    id="loginBox"
    class="box"
  >

    <h2>تسجيل دخول الإدارة</h2>

    <label>
      الإيميل
    </label>

    <input
      id="email"
      type="email"
      placeholder="admin@email.com"
    >

    <label>
      كلمة المرور
    </label>

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      id="loginButton"
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>


  <!-- ADMIN -->

  <div
    id="adminPanel"
    class="hidden"
  >


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <span
          id="productsCount"
          class="stat-number"
        >
          0
        </span>

        <span class="stat-label">
          عدد المنتجات
        </span>

      </div>


      <div class="stat">

        <span
          id="productsValue"
          class="stat-number"
        >
          0
        </span>

        <span class="stat-label">
          إجمالي قيمة المنتجات
        </span>

      </div>

    </div>


    <!-- ADD / EDIT -->

    <div class="box">

      <div class="top-bar">

        <h2 id="formTitle">
          إضافة منتج
        </h2>

        <button
          class="logout"
          onclick="logout()"
        >
          خروج
        </button>

      </div>


      <label>
        اسم المنتج
      </label>

      <input
        id="productName"
        type="text"
        placeholder="مثال: خاتم فاخر"
      >


      <label>
        السعر
      </label>

      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="280"
      >


      <label>
        القسم
      </label>

      <select
        id="productCategory"
      >

        <option value="خواتم">
          خواتم
        </option>

        <option value="سلاسل">
          سلاسل
        </option>

        <option value="أساور">
          أساور
        </option>

        <option value="حلق">
          حلق
        </option>

      </select>


      <label>
        الوصف
      </label>

      <textarea
        id="productDescription"
        placeholder="اكتب وصف المنتج..."
      ></textarea>


      <label>
        صورة المنتج
        <span id="imageHint"></span>
      </label>

      <input
        id="productImage"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        onchange="previewImage(event)"
      >


      <!-- IMAGE PREVIEW -->

      <div
        id="imagePreviewBox"
        class="image-preview-box hidden"
      >

        <img
          id="imagePreview"
          class="image-preview"
          src=""
          alt="معاينة الصورة"
        >

      </div>


      <button
        id="saveButton"
        class="primary"
        onclick="saveProduct()"
      >
        إضافة المنتج
      </button>


      <button
        id="cancelButton"
        class="cancel hidden"
        onclick="cancelEdit()"
      >
        إلغاء التعديل
      </button>


      <div
        id="addStatus"
        class="status"
      ></div>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

      <div class="top-bar">

        <h2>
          المنتجات الحالية
        </h2>

        <button
          class="refresh"
          onclick="loadProducts()"
        >
          تحديث
        </button>

      </div>


      <!-- SEARCH -->

      <div class="search-box">

        <input
          id="searchProducts"
          type="search"
          placeholder="🔍 ابحث باسم المنتج أو القسم..."
          oninput="filterAdminProducts()"
        >

      </div>


      <div id="productsList">
        جاري التحميل...
      </div>

    </div>


  </div>

</div>


<!-- DELETE CONFIRMATION -->

<div
  id="deleteModal"
  class="modal hidden"
>

  <div class="modal-box">

    <h3>
      تأكيد حذف المنتج
    </h3>

    <p>
      هل أنت متأكد أنك تريد حذف هذا المنتج؟
    </p>

    <div class="modal-buttons">

      <button
        class="delete"
        onclick="confirmDelete()"
      >
        حذف
      </button>

      <button
        class="cancel"
        onclick="closeDeleteModal()"
      >
        إلغاء
      </button>

    </div>

  </div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://nflcafxxjhinumvxyyxt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yoOuiG8GPwZbKcikdntB-g_k7K_06IQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   VARIABLES
========================= */

let editingProductId = null;

let productToDelete = null;

let allProducts = [];


/* =========================
   STATUS
========================= */

function showStatus(id, message) {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.textContent =
    message;

  element.classList.add("show");

}


/* =========================
   IMAGE PREVIEW
========================= */

function previewImage(event) {

  const file =
    event.target.files[0];

  const box =
    document.getElementById(
      "imagePreviewBox"
    );

  const image =
    document.getElementById(
      "imagePreview"
    );


  if (!file) {

    image.src = "";

    box.classList.add(
      "hidden"
    );

    return;

  }


  if (
    !file.type.startsWith("image/")
  ) {

    alert(
      "من فضلك اختر ملف صورة."
    );

    event.target.value = "";

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      image.src =
        e.target.result;

      box.classList.remove(
        "hidden"
      );

    };


  reader.readAsDataURL(file);

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showStatus(
      "loginStatus",
      "اكتب الإيميل وكلمة المرور."
    );

    return;

  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled = true;

  button.textContent =
    "جاري الدخول...";


  const result =
    await supabaseClient.auth
      .signInWithPassword({

        email: email,

        password: password

      });


  button.disabled = false;

  button.textContent =
    "دخول";


  if (result.error) {

    console.error(
      result.error
    );

    showStatus(
      "loginStatus",
      "بيانات الدخول غير صحيحة."
    );

    return;

  }


  document
    .getElementById("loginBox")
    .classList.add(
      "hidden"
    );


  document
    .getElementById("adminPanel")
    .classList.remove(
      "hidden"
    );


  loadProducts();

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient
    .auth
    .signOut();

  location.reload();

}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

  const result =
    await supabaseClient
      .auth
      .getSession();


  if (
    result.data &&
    result.data.session
  ) {

    document
      .getElementById("loginBox")
      .classList.add(
        "hidden"
      );


    document
      .getElementById("adminPanel")
      .classList.remove(
        "hidden"
      );


    loadProducts();

  }

}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById(
          "productPrice"
        )
        .value
    );


  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value;


  const description =
    document
      .getElementById(
        "productDescription"
      )
      .value
      .trim();


  const file =
    document
      .getElementById(
        "productImage"
      )
      .files[0];


  const button =
    document.getElementById(
      "saveButton"
    );


  if (
    !name ||
    !price ||
    !category
  ) {

    showStatus(
      "addStatus",
      "من فضلك املأ اسم المنتج والسعر والقسم."
    );

    return;

  }


  if (
    editingProductId === null &&
    !file
  ) {

    showStatus(
      "addStatus",
      "من فضلك اختر صورة للمنتج."
    );

    return;

  }


  button.disabled = true;


  button.textContent =
    editingProductId === null
      ? "جاري إضافة المنتج..."
      : "جاري حفظ التعديل...";


  let imageUrl = null;


  /* =========================
     UPLOAD IMAGE
  ========================= */

  if (file) {

    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9.-]/g,
        "-"
      );


    const fileName =
      Date.now() +
      "-" +
      safeName;


    const upload =
      await supabaseClient
        .storage
        .from("products")
        .upload(
          fileName,
          file,
          {
            upsert: false
          }
        );


    if (upload.error) {

      console.error(
        "Upload error:",
        upload.error
      );


      showStatus(
        "addStatus",
        "حدث خطأ أثناء رفع الصورة."
      );


      button.disabled = false;

      button.textContent =
        editingProductId === null
          ? "إضافة المنتج"
          : "حفظ التعديل";


      return;

    }


    const publicData =
      supabaseClient
        .storage
        .from("products")
        .getPublicUrl(
          fileName
        );


    imageUrl =
      publicData.data.publicUrl;

  }


  /* =========================
     ADD
  ========================= */

  if (
    editingProductId === null
  ) {

    const result =
      await supabaseClient
        .from("Velora")
        .insert({

          name: name,

          price: price,

          description: description,

          category: category,

          image: imageUrl

        });


    if (result.error) {

      console.error(
        "Insert error:",
        result.error
      );


      showStatus(
        "addStatus",
        "حدث خطأ أثناء حفظ المنتج."
      );


      button.disabled = false;

      button.textContent =
        "إضافة المنتج";


      return;

    }


    showStatus(
      "addStatus",
      "تم إضافة المنتج بنجاح ✅"
    );

  }


  /* =========================
     UPDATE
  ========================= */

  else {

    const updateData = {

      name: name,

      price: price,

      description: description,

      category: category

    };


    if (imageUrl) {

      updateData.image =
        imageUrl;

    }


    const result =
      await supabaseClient
        .from("Velora")
        .update(
          updateData
        )
        .eq(
          "id",
          editingProductId
        );


    if (result.error) {

      console.error(
        "Update error:",
        result.error
      );


      showStatus(
        "addStatus",
        "حدث خطأ أثناء تعديل المنتج."
      );


      button.disabled = false;

      button.textContent =
        "حفظ التعديل";


      return;

    }


    showStatus(
      "addStatus",
      "تم تعديل المنتج بنجاح ✅"
    );

  }


  resetForm();

  await loadProducts();


  button.disabled = false;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const list =
    document.getElementById(
      "productsList"
    );


  if (!list) return;


  list.textContent =
    "جاري التحميل...";


  const result =
    await supabaseClient
      .from("Velora")
      .select("*")
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (result.error) {

    console.error(
      "Load error:",
      result.error
    );


    list.textContent =
      "حدث خطأ في تحميل المنتجات.";


    return;

  }


  allProducts =
    result.data || [];


  updateStats();

  renderAdminProducts(
    allProducts
  );

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderAdminProducts(
  products
) {

  const list =
    document.getElementById(
      "productsList"
    );


  if (
    !products ||
    !products.length
  ) {

    list.innerHTML =
      '<div class="empty">لا توجد منتجات حاليًا.</div>';

    return;

  }


  list.innerHTML =
    products.map(
      function(product) {

        return `

          <div class="product">

            <img
              src="${escapeHTML(product.image || "")}"
              alt="${escapeHTML(product.name)}"
            >

            <div class="product-info">

              <h3>
                ${escapeHTML(product.name)}
              </h3>

              <div class="product-price">
                ${Number(product.price)} جنيه
              </div>

              <div class="product-category">
                ${escapeHTML(product.category)}
              </div>

              <div class="product-description">
                ${escapeHTML(product.description || "")}
              </div>

            </div>

            <div class="actions">

              <button
                class="edit"
                onclick="editProduct(${product.id})"
              >
                ✏️ تعديل
              </button>

              <button
                class="delete"
                onclick="openDeleteModal(${product.id})"
              >
                🗑️ حذف
              </button>

            </div>

          </div>

        `;

      }
    ).join("");

}


/* =========================
   SEARCH
========================= */

function filterAdminProducts() {

  const input =
    document.getElementById(
      "searchProducts"
    );


  const query =
    input
      .value
      .trim()
      .toLowerCase();


  if (!query) {

    renderAdminProducts(
      allProducts
    );

    return;

  }


  const filtered =
    allProducts.filter(
      function(product) {

        const name =
          String(
            product.name || ""
          ).toLowerCase();


        const category =
          String(
            product.category || ""
          ).toLowerCase();


        const description =
          String(
            product.description || ""
          ).toLowerCase();


        return (
          name.includes(query) ||
          category.includes(query) ||
          description.includes(query)
        );

      }
    );


  renderAdminProducts(
    filtered
  );

}


/* =========================
   STATS
========================= */

function updateStats() {

  const count =
    allProducts.length;


  const value =
    allProducts.reduce(
      function(sum, product) {

        return (
          sum +
          Number(
            product.price || 0
          )
        );

      },
      0
    );


  document
    .getElementById(
      "productsCount"
    )
    .textContent =
      count;


  document
    .getElementById(
      "productsValue"
    )
    .textContent =
      value.toLocaleString(
        "ar-EG"
      ) +
      " جنيه";

}


/* =========================
   EDIT
========================= */

async function editProduct(id) {

  const result =
    await supabaseClient
      .from("Velora")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (
    result.error ||
    !result.data
  ) {

    alert(
      "تعذر تحميل بيانات المنتج."
    );

    return;

  }


  const product =
    result.data;


  editingProductId =
    product.id;


  document
    .getElementById(
      "productName"
    )
    .value =
      product.name || "";


  document
    .getElementById(
      "productPrice"
    )
    .value =
      product.price || "";


  document
    .getElementById(
      "productCategory"
    )
    .value =
      product.category || "خواتم";


  document
    .getElementById(
      "productDescription"
    )
    .value =
      product.description || "";


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "تعديل المنتج";


  document
    .getElementById(
      "saveButton"
    )
    .textContent =
      "حفظ التعديل";


  document
    .getElementById(
      "cancelButton"
    )
    .classList.remove(
      "hidden"
    );


  document
    .getElementById(
      "imageHint"
    )
    .textContent =
      " — اتركها فارغة للاحتفاظ بالصورة الحالية";


  document
    .getElementById(
      "productImage"
    )
    .value = "";


  const preview =
    document.getElementById(
      "imagePreview"
    );


  const previewBox =
    document.getElementById(
      "imagePreviewBox"
    );


  if (product.image) {

    preview.src =
      product.image;

    previewBox.classList.remove(
      "hidden"
    );

  }


  document
    .getElementById(
      "addStatus"
    )
    .classList.remove(
      "show"
    );


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================
   RESET
========================= */

  editingProductId =
    null;


  document
    .getElementById(
      "productName"
    )
    .value = "";


  document
    .getElementById(
      "productPrice"
    )
    .value = "";


  document
    .getElementById(
      "productDescription"
    )
    .value = "";


  document
    .getElementById(
      "productImage"
    )
    .value = "";


  document
    .getElementById(
      "formTitle"
    )
    .textContent =
      "إضافة منتج";


  document
    .getElementById(
      "saveButton"
    )
    .textContent =
      "إضافة المنتج";


  document
    .getElementById(
      "cancelButton"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "imageHint"
    )
    .textContent = "";


  document
    .getElementById(
      "imagePreview"
    )
    .src = "";


  document
    .getElementById(
      "imagePreviewBox"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  resetForm();

  document
    .getElementById(
      "addStatus"
    )
    .classList.remove(
      "show"
    );

}


/* =========================
   DELETE MODAL
========================= */

function openDeleteModal(id) {

  productToDelete =
    id;


  document
    .getElementById(
      "deleteModal"
    )
    .classList.remove(
      "hidden"
    );

}


function closeDeleteModal() {

  productToDelete =
    null;


  document
    .getElementById(
      "deleteModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================
   DELETE PRODUCT
========================= */

async function confirmDelete() {

  if (
    productToDelete === null
  ) {

    return;

  }


  const id =
    productToDelete;


  const result =
    await supabaseClient
      .from("Velora")
      .delete()
      .eq(
        "id",
        id
      );


  if (result.error) {

    console.error(
      "Delete error:",
      result.error
    );


    alert(
      "حدث خطأ أثناء حذف المنتج."
    );


    return;

  }


  closeDeleteModal();


  if (
    Number(editingProductId) ===
    Number(id)
  ) {

    resetForm();

  }


  showStatus(
    "addStatus",
    "تم حذف المنتج بنجاح ✅"
  );


  await loadProducts();

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
