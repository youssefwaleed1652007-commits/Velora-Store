<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELORA | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171514;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      letter-spacing: 5px;
    }

    .logo p {
      color: #c9a96e;
    }

    .box {
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #4b4541;
      background: #171514;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
    }

    .logout {
      background: #3b3633;
      color: #fff;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .show {
      display: block;
    }

    .product {
      border-top: 1px solid #3b3633;
      padding: 15px 0;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      margin: 0 0 5px;
    }

    .product-info p {
      margin: 3px 0;
      color: #c9a96e;
    }

    .delete {
      background: #6b2929;
      color: white;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>VELORA</h1>
    <p>ADMIN PANEL</p>
  </div>


  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h2>تسجيل دخول الإدارة</h2>

    <label>الإيميل</label>

    <input
      id="email"
      type="email"
      placeholder="admin@email.com"
    >

    <label>كلمة المرور</label>

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel" class="hidden">

    <div class="box">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">

        <h2>إضافة منتج</h2>

        <button
          class="logout"
          onclick="logout()"
        >
          خروج
        </button>

      </div>


      <label>اسم المنتج</label>

      <input
        id="productName"
        type="text"
        placeholder="مثال: خاتم فاخر"
      >


      <label>السعر</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="280"
      >


      <label>القسم</label>

      <select id="productCategory">

        <option value="خواتم">خواتم</option>
        <option value="سلاسل">سلاسل</option>
        <option value="أساور">أساور</option>
        <option value="حلق">حلق</option>

      </select>


      <label>الوصف</label>

      <textarea
        id="productDescription"
        placeholder="اكتب وصف المنتج..."
      ></textarea>


      <label>صورة المنتج</label>

      <input
        id="productImage"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >


      <button
        class="primary"
        onclick="addProduct()"
      >
        إضافة المنتج
      </button>


      <div
        id="addStatus"
        class="status"
      ></div>

    </div>


    <div class="box">

      <h2>المنتجات الحالية</h2>

      <div id="productsList">
        جاري التحميل...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL = "https://nflcafxxjhinumvxyyxt.supabase.co";

const SUPABASE_KEY = "sb_publishable_yoOuiG8GPwZbKcikdntB-g_k7K_06IQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function showStatus(id, message) {

  const element =
    document.getElementById(id);

  element.textContent = message;

  element.classList.add("show");

}


async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!email || !password) {

    showStatus(
      "loginStatus",
      "اكتب الإيميل وكلمة المرور."
    );

    return;

  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    showStatus(
      "loginStatus",
      "بيانات الدخول غير صحيحة."
    );

    return;

  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("adminPanel")
    .classList.remove("hidden");


  loadProducts();

}


async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();

}


async function checkLogin() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (
    data &&
    data.session
  ) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadProducts();

  }

}


async function addProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const category =
    document
      .getElementById("productCategory")
      .value;


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const file =
    document
      .getElementById("productImage")
      .files[0];


  if (
    !name ||
    !price ||
    !category ||
    !file
  ) {

    showStatus(
      "addStatus",
      "من فضلك املأ البيانات واختر صورة."
    );

    return;

  }


  showStatus(
    "addStatus",
    "جاري إضافة المنتج..."
  );


  const fileName =
    Date.now() +
    "-" +
    file.name.replace(
      /[^a-zA-Z0-9.-]/g,
      "-"
    );


  const filePath =
    fileName;


  const upload =
    await supabaseClient
      .storage
      .from("products")
      .upload(
        filePath,
        file,
        {
          upsert: false
        }
      );


  if (upload.error) {

    showStatus(
      "addStatus",
      "حدث خطأ أثناء رفع الصورة."
    );

    return;

  }


  const {
    data: publicData
  } =
    supabaseClient
      .storage
      .from("products")
      .getPublicUrl(filePath);


  const imageUrl =
    publicData.publicUrl;


  const insert =
    await supabaseClient
      .from("Velora")
      .insert({

        name: name,

        price: price,

        description: description,

        category: category,

        image: imageUrl

      });


  if (insert.error) {

    showStatus(
      "addStatus",
      "حدث خطأ أثناء حفظ المنتج."
    );

    return;

  }


  showStatus(
    "addStatus",
    "تم إضافة المنتج بنجاح ✅"
  );


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("productImage")
    .value = "";


  loadProducts();

}


async function loadProducts() {

  const list =
    document.getElementById("productsList");


  list.textContent =
    "جاري التحميل...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Velora")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    list.textContent =
      "حدث خطأ في تحميل المنتجات.";

    return;

  }


  if (!data || !data.length) {

    list.textContent =
      "لا توجد منتجات حاليًا.";

    return;

  }


  list.innerHTML =
    data.map(function(product) {

      return `

        <div class="product">

          <img
            src="${product.image}"
            alt="${product.name}"
          >

          <div class="product-info">

            <h3>
              ${product.name}
            </h3>

            <p>
              ${product.price} جنيه
            </p>

            <small>
              ${product.category}
            </small>

          </div>

          <button
            class="delete"
            onclick="deleteProduct(${product.id})"
          >
            حذف
          </button>

        </div>

      `;

    }).join("");

}


async function deleteProduct(id) {

  if (
    !confirm(
      "هل تريد حذف هذا المنتج؟"
    )
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("Velora")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "حدث خطأ أثناء حذف المنتج."
    );

    return;

  }


  loadProducts();

}


checkLogin();

</script>

</body>
</html>
