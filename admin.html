<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELORA | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171514;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 760px;
      margin: 30px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      letter-spacing: 5px;
    }

    .logo p {
      color: #c9a96e;
    }

    .box {
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #4b4541;
      background: #171514;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
    }

    .logout {
      background: #3b3633;
      color: #fff;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      background: #2b2725;
    }

    .show {
      display: block;
    }

    .product {
      border-top: 1px solid #3b3633;
      padding: 15px 0;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-info {
      flex: 1;
      min-width: 180px;
    }

    .product-info h3 {
      margin: 0 0 5px;
    }

    .product-info p {
      margin: 4px 0;
      color: #c9a96e;
    }

    .product-info small {
      display: block;
      margin-top: 4px;
      color: #ddd;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .delete {
      background: #6b2929;
      color: white;
    }

    .edit {
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
    }

    .cancel {
      background: #3b3633;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    .hint {
      color: #aaa;
      font-size: 13px;
      margin-top: 7px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .container {
        margin: 10px auto;
      }

      .box {
        padding: 18px;
      }

      .product {
        align-items: flex-start;
      }

      .product-actions {
        width: 100%;
      }

      .product-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>VELORA</h1>
    <p>ADMIN PANEL</p>
  </div>


  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h2>تسجيل دخول الإدارة</h2>

    <label>الإيميل</label>

    <input
      id="email"
      type="email"
      placeholder="admin@email.com"
    >

    <label>كلمة المرور</label>

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" class="hidden">


    <!-- PRODUCT FORM -->

    <div class="box">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">

        <h2 id="formTitle">
          إضافة منتج
        </h2>

        <button
          class="logout"
          onclick="logout()"
        >
          خروج
        </button>

      </div>


      <label>اسم المنتج</label>

      <input
        id="productName"
        type="text"
        placeholder="مثال: خاتم فاخر"
      >


      <label>السعر</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="280"
      >


      <label>القسم</label>

      <select id="productCategory">

        <option value="خواتم">خواتم</option>
        <option value="سلاسل">سلاسل</option>
        <option value="أساور">أساور</option>
        <option value="حلق">حلق</option>

      </select>


      <label>الوصف</label>

      <textarea
        id="productDescription"
        placeholder="اكتب وصف المنتج..."
      ></textarea>


      <!-- COLORS -->

      <label>
        الألوان المتاحة
      </label>

      <input
        id="productColors"
        type="text"
        placeholder="مثال: ذهبي, فضي, روز جولد"
      >

      <div class="hint">
        افصل بين كل لون والآخر بفاصلة.
      </div>


      <!-- SIZES -->

      <label>
        المقاسات المتاحة
      </label>

      <input
        id="productSizes"
        type="text"
        placeholder="مثال: 6, 7, 8, 9"
      >

      <div class="hint">
        افصل بين كل مقاس والآخر بفاصلة. إذا كان المنتج بدون مقاس، اترك الحقل فارغًا.
      </div>


      <!-- IMAGE -->

      <label>
        صورة المنتج
      </label>

      <input
        id="productImage"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

      <div
        id="currentImageText"
        class="hint"
      ></div>


      <button
        id="saveButton"
        class="primary"
        onclick="saveProduct()"
      >
        إضافة المنتج
      </button>


      <button
        id="cancelButton"
        class="cancel hidden"
        onclick="cancelEdit()"
      >
        إلغاء التعديل
      </button>


      <div
        id="addStatus"
        class="status"
      ></div>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

      <h2>
        المنتجات الحالية
      </h2>

      <div id="productsList">
        جاري التحميل...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nflcafxxjhinumvxyyxt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yoOuiG8GPwZbKcikdntB-g_k7K_06IQ";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingProductId = null;

let editingProductImage = "";


/* =========================================================
   STATUS
========================================================= */

function showStatus(id, message) {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.textContent =
    message;

  element.classList.add("show");
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!email || !password) {

    showStatus(
      "loginStatus",
      "اكتب الإيميل وكلمة المرور."
    );

    return;
  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    console.error(error);

    showStatus(
      "loginStatus",
      "بيانات الدخول غير صحيحة."
    );

    return;
  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("adminPanel")
    .classList.remove("hidden");


  loadProducts();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();
}


/* =========================================================
   CHECK LOGIN
========================================================= */

async function checkLogin() {

  const {
    data
  } =
    await supabaseClient.auth.getSession();


  if (
    data &&
    data.session
  ) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadProducts();
  }
}


/* =========================================================
   CONVERT COMMA TEXT TO ARRAY
========================================================= */

function textToArray(text) {

  return String(text || "")
    .split(",")
    .map(function(item) {
      return item.trim();
    })
    .filter(function(item) {
      return item.length > 0;
    });
}


/* =========================================================
   CONVERT ARRAY TO TEXT
========================================================= */

function arrayToText(value) {

  if (!Array.isArray(value)) {
    return "";
  }

  return value.join(", ");
}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const category =
    document
      .getElementById("productCategory")
      .value;


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const colors =
    textToArray(
      document
        .getElementById("productColors")
        .value
    );


  const sizes =
    textToArray(
      document
        .getElementById("productSizes")
        .value
    );


  const file =
    document
      .getElementById("productImage")
      .files[0];


  if (
    !name ||
    !price ||
    !category
  ) {

    showStatus(
      "addStatus",
      "من فضلك املأ اسم المنتج والسعر والقسم."
    );

    return;
  }


  showStatus(
    "addStatus",
    editingProductId
      ? "جاري حفظ التعديل..."
      : "جاري إضافة المنتج..."
  );


  let imageUrl =
    editingProductImage;


  /* =======================================================
     UPLOAD NEW IMAGE
  ======================================================= */

  if (file) {

    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      "-" +
      file.name.replace(
        /[^a-zA-Z0-9.-]/g,
        "-"
      );


    const upload =
      await supabaseClient
        .storage
        .from("products")
        .upload(
          fileName,
          file,
          {
            upsert: false
          }
        );


    if (upload.error) {

      console.error(
        "Upload Error:",
        upload.error
      );

      showStatus(
        "addStatus",
        "حدث خطأ أثناء رفع الصورة."
      );

      return;
    }


    const {
      data: publicData
    } =
      supabaseClient
        .storage
        .from("products")
        .getPublicUrl(fileName);


    imageUrl =
      publicData.publicUrl;
  }


  /* =======================================================
     EDIT PRODUCT
  ======================================================= */

  if (editingProductId) {

    const update =
      await supabaseClient
        .from("Velora")
        .update({

          name: name,

          price: price,

          description: description,

          category: category,

          colors: colors,

          sizes: sizes,

          image: imageUrl

        })
        .eq(
          "id",
          editingProductId
        );


    if (update.error) {

      console.error(
        "Update Error:",
        update.error
      );

      showStatus(
        "addStatus",
        "حدث خطأ أثناء تعديل المنتج."
      );

      return;
    }


    showStatus(
      "addStatus",
      "تم تعديل المنتج بنجاح ✅"
    );


    resetForm();

    loadProducts();

    return;
  }


  /* =======================================================
     ADD PRODUCT
  ======================================================= */

  if (!imageUrl) {

    showStatus(
      "addStatus",
      "من فضلك اختر صورة للمنتج."
    );

    return;
  }


  const insert =
    await supabaseClient
      .from("Velora")
      .insert({

        name: name,

        price: price,

        description: description,

        category: category,

        colors: colors,

        sizes: sizes,

        image: imageUrl

      });


  if (insert.error) {

    console.error(
      "Insert Error:",
      insert.error
    );

    showStatus(
      "addStatus",
      "حدث خطأ أثناء حفظ المنتج."
    );

    return;
  }


  showStatus(
    "addStatus",
    "تم إضافة المنتج بنجاح ✅"
  );


  resetForm();

  loadProducts();
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

  const list =
    document.getElementById("productsList");


  if (!list) return;


  list.textContent =
    "جاري التحميل...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Velora")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    console.error(
      "Load Error:",
      error
    );

    list.textContent =
      "حدث خطأ في تحميل المنتجات.";

    return;
  }


  if (
    !data ||
    !data.length
  ) {

    list.textContent =
      "لا توجد منتجات حاليًا.";

    return;
  }


  list.innerHTML =
    data.map(function(product) {

      const colors =
        Array.isArray(product.colors)
          ? product.colors.join("، ")
          : "لا يوجد";


      const sizes =
        Array.isArray(product.sizes)
          ? product.sizes.join("، ")
          : "لا يوجد";


      return `

        <div class="product">

          <img
            src="${product.image || ""}"
            alt="${escapeHTML(product.name || "")}"
          >


          <div class="product-info">

            <h3>
              ${escapeHTML(product.name || "")}
            </h3>


            <p>
              ${Number(product.price || 0)} جنيه
            </p>


            <small>
              القسم: ${escapeHTML(product.category || "")}
            </small>


            <small>
              الألوان: ${escapeHTML(colors)}
            </small>


            <small>
              المقاسات: ${escapeHTML(sizes)}
            </small>

          </div>


          <div class="product-actions">

            <button
              class="edit"
              onclick="editProduct(${product.id})"
            >
              ✏️ تعديل
            </button>


            <button
              class="delete"
              onclick="deleteProduct(${product.id})"
            >
              حذف
            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================================================
   EDIT PRODUCT
========================================================= */

async function editProduct(id) {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("Velora")
      .select("*")
      .eq("id", id)
      .single();


  if (error || !data) {

    alert(
      "تعذر تحميل بيانات المنتج."
    );

    return;
  }


  editingProductId =
    data.id;


  editingProductImage =
    data.image || "";


  document
    .getElementById("productName")
    .value =
    data.name || "";


  document
    .getElementById("productPrice")
    .value =
    data.price || "";


  document
    .getElementById("productCategory")
    .value =
    data.category || "خواتم";


  document
    .getElementById("productDescription")
    .value =
    data.description || "";


  document
    .getElementById("productColors")
    .value =
    arrayToText(data.colors);


  document
    .getElementById("productSizes")
    .value =
    arrayToText(data.sizes);


  document
    .getElementById("productImage")
    .value =
    "";


  document
    .getElementById("formTitle")
    .textContent =
    "تعديل المنتج";


  document
    .getElementById("saveButton")
    .textContent =
    "حفظ التعديل";


  document
    .getElementById("cancelButton")
    .classList.remove("hidden");


  document
    .getElementById("currentImageText")
    .textContent =
    data.image
      ? "الصورة الحالية محفوظة. اختر صورة جديدة فقط إذا كنت تريد تغييرها."
      : "";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   CANCEL EDIT
========================================================= */

function cancelEdit() {

  resetForm();

  showStatus(
    "addStatus",
    "تم إلغاء التعديل."
  );
}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

  editingProductId =
    null;

  editingProductImage =
    "";


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productCategory")
    .value = "خواتم";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("productColors")
    .value = "";


  document
    .getElementById("productSizes")
    .value = "";


  document
    .getElementById("productImage")
    .value = "";


  document
    .getElementById("formTitle")
    .textContent =
    "إضافة منتج";


  document
    .getElementById("saveButton")
    .textContent =
    "إضافة المنتج";


  document
    .getElementById("cancelButton")
    .classList.add("hidden");


  document
    .getElementById("currentImageText")
    .textContent = "";
}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "هل تريد حذف هذا المنتج؟"
    )
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("Velora")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Delete Error:",
      error
    );

    alert(
      "حدث خطأ أثناء حذف المنتج."
    );

    return;
  }


  loadProducts();
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


/* =========================================================
   START
========================================================= */

checkLogin();

</script>

</body>
</html>
