<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELORA | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171514;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 30px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      letter-spacing: 5px;
    }

    .logo p {
      color: #c9a96e;
    }

    .box {
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #4b4541;
      background: #171514;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
    }

    .logout {
      background: #3b3633;
      color: #fff;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.7;
    }

    .show {
      display: block;
    }

    .product {
      border-top: 1px solid #3b3633;
      padding: 18px 0;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .product:first-child {
      border-top: 0;
    }

    .product img {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 12px;
      background: #171514;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 0;
    }

    .product-info h3 {
      margin: 0 0 6px;
    }

    .product-info p {
      margin: 4px 0;
      color: #c9a96e;
    }

    .product-info small {
      color: #aaa;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit {
      background: #c9a96e;
      color: #171514;
    }

    .delete {
      background: #6b2929;
      color: white;
    }

    .cancel {
      background: #3b3633;
      color: #fff;
      width: 100%;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .section-title h2 {
      margin: 0;
    }

    .refresh {
      background: #3b3633;
      color: #fff;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #aaa;
    }

    @media (max-width: 650px) {

      body {
        padding: 12px;
      }

      .container {
        margin: 10px auto;
      }

      .box {
        padding: 18px;
      }

      .product {
        align-items: flex-start;
      }

      .product img {
        width: 65px;
        height: 65px;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>VELORA</h1>
    <p>ADMIN PANEL</p>
  </div>


  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h2>تسجيل دخول الإدارة</h2>

    <label>الإيميل</label>

    <input
      id="email"
      type="email"
      placeholder="admin@email.com"
    >

    <label>كلمة المرور</label>

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
    >

    <button
      id="loginButton"
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

    <div id="loginStatus" class="status"></div>

  </div>


  <!-- ADMIN PANEL -->

  <div id="adminPanel" class="hidden">


    <!-- ADD / EDIT -->

    <div class="box">

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">

        <h2 id="formTitle">إضافة منتج</h2>

        <button
          class="logout"
          onclick="logout()"
        >
          خروج
        </button>

      </div>


      <label>اسم المنتج</label>

      <input
        id="productName"
        type="text"
        placeholder="مثال: خاتم فاخر"
      >


      <label>السعر</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="280"
      >


      <label>القسم</label>

      <select id="productCategory">

        <option value="خواتم">خواتم</option>
        <option value="سلاسل">سلاسل</option>
        <option value="أساور">أساور</option>
        <option value="حلق">حلق</option>

      </select>


      <label>الوصف</label>

      <textarea
        id="productDescription"
        placeholder="اكتب وصف المنتج..."
      ></textarea>


      <label>
        صورة المنتج
        <span id="imageHint"></span>
      </label>

      <input
        id="productImage"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >


      <button
        id="saveButton"
        class="primary"
        onclick="saveProduct()"
      >
        إضافة المنتج
      </button>


      <button
        id="cancelButton"
        class="cancel hidden"
        onclick="cancelEdit()"
      >
        إلغاء التعديل
      </button>


      <div
        id="addStatus"
        class="status"
      ></div>

    </div>


    <!-- PRODUCTS -->

    <div class="box">

      <div class="section-title">

        <h2>المنتجات الحالية</h2>

        <button
          class="refresh"
          onclick="loadProducts()"
        >
          تحديث
        </button>

      </div>

      <div id="productsList">
        جاري التحميل...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nflcafxxjhinumvxyyxt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_yoOuiG8GPwZbKcikdntB-g_k7K_06IQ";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingProductId = null;


/* =========================
   STATUS
========================= */

function showStatus(id, message) {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.textContent = message;

  element.classList.add("show");
}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const button =
    document.getElementById("loginButton");


  if (!email || !password) {

    showStatus(
      "loginStatus",
      "اكتب الإيميل وكلمة المرور."
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "جاري الدخول...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  button.disabled = false;

  button.textContent =
    "دخول";


  if (error) {

    console.error(error);

    showStatus(
      "loginStatus",
      "بيانات الدخول غير صحيحة."
    );

    return;
  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("adminPanel")
    .classList.remove("hidden");


  loadProducts();
}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();
}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

  const result =
    await supabaseClient.auth.getSession();


  if (
    result.data &&
    result.data.session
  ) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadProducts();
  }
}


/* =========================
   SAVE PRODUCT
========================= */

async function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const category =
    document
      .getElementById("productCategory")
      .value;


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const file =
    document
      .getElementById("productImage")
      .files[0];


  const saveButton =
    document.getElementById("saveButton");


  if (
    !name ||
    !price ||
    !category
  ) {

    showStatus(
      "addStatus",
      "من فضلك املأ اسم المنتج والسعر والقسم."
    );

    return;
  }


  if (
    editingProductId === null &&
    !file
  ) {

    showStatus(
      "addStatus",
      "من فضلك اختر صورة للمنتج."
    );

    return;
  }


  saveButton.disabled = true;

  saveButton.textContent =
    editingProductId === null
      ? "جاري إضافة المنتج..."
      : "جاري حفظ التعديل...";


  let imageUrl = null;


  /* =========================
     UPLOAD NEW IMAGE
  ========================= */

  if (file) {

    const fileName =
      Date.now() +
      "-" +
      file.name.replace(
        /[^a-zA-Z0-9.-]/g,
        "-"
      );


    const upload =
      await supabaseClient
        .storage
        .from("products")
        .upload(
          fileName,
          file,
          {
            upsert: false
          }
        );


    if (upload.error) {

      console.error(
        "Upload error:",
        upload.error
      );

      showStatus(
        "addStatus",
        "حدث خطأ أثناء رفع الصورة."
      );

      saveButton.disabled = false;

      saveButton.textContent =
        editingProductId === null
          ? "إضافة المنتج"
          : "حفظ التعديل";

      return;
    }


    const publicData =
      supabaseClient
        .storage
        .from("products")
        .getPublicUrl(fileName);


    imageUrl =
      publicData.data.publicUrl;
  }


  /* =========================
     ADD PRODUCT
  ========================= */

  if (editingProductId === null) {

    const insert =
      await supabaseClient
        .from("Velora")
        .insert({

          name: name,

          price: price,

          description: description,

          category: category,

          image: imageUrl

        });


    if (insert.error) {

      console.error(
        "Insert error:",
        insert.error
      );

      showStatus(
        "addStatus",
        "حدث خطأ أثناء حفظ المنتج."
      );

      saveButton.disabled = false;

      saveButton.textContent =
        "إضافة المنتج";

      return;
    }


    showStatus(
      "addStatus",
      "تم إضافة المنتج بنجاح ✅"
    );

  }


  /* =========================
     UPDATE PRODUCT
  ========================= */

  else {

    const updateData = {

      name: name,

      price: price,

      description: description,

      category: category

    };


    if (imageUrl) {

      updateData.image =
        imageUrl;

    }


    const update =
      await supabaseClient
        .from("Velora")
        .update(updateData)
        .eq("id", editingProductId);


    if (update.error) {

      console.error(
        "Update error:",
        update.error
      );

      showStatus(
        "addStatus",
        "حدث خطأ أثناء تعديل المنتج."
      );

      saveButton.disabled = false;

      saveButton.textContent =
        "حفظ التعديل";

      return;
    }


    showStatus(
      "addStatus",
      "تم تعديل المنتج بنجاح ✅"
    );

  }


  resetForm();

  await loadProducts();

  saveButton.disabled = false;

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const list =
    document.getElementById("productsList");


  if (!list) return;


  list.textContent =
    "جاري التحميل...";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("Velora")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    console.error(
      "Load products error:",
      error
    );

    list.textContent =
      "حدث خطأ في تحميل المنتجات.";

    return;
  }


  if (!data || !data.length) {

    list.innerHTML =
      '<div class="empty">لا توجد منتجات حاليًا.</div>';

    return;
  }


  list.innerHTML =
    data.map(function(product) {

      return `

        <div class="product">

          <img
            src="${product.image || ""}"
            alt="${escapeHTML(product.name)}"
          >

          <div class="product-info">

            <h3>
              ${escapeHTML(product.name)}
            </h3>

            <p>
              ${Number(product.price)} جنيه
            </p>

            <small>
              ${escapeHTML(product.category)}
            </small>

          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="editProduct(${product.id})"
            >
              تعديل
            </button>

            <button
              class="delete"
              onclick="deleteProduct(${product.id})"
            >
              حذف
            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id) {

  const result =
    await supabaseClient
      .from("Velora")
      .select("*")
      .eq("id", id)
      .single();


  if (result.error || !result.data) {

    alert(
      "تعذر تحميل بيانات المنتج."
    );

    return;
  }


  const product =
    result.data;


  editingProductId =
    product.id;


  document
    .getElementById("productName")
    .value =
      product.name || "";


  document
    .getElementById("productPrice")
    .value =
      product.price || "";


  document
    .getElementById("productCategory")
    .value =
      product.category || "خواتم";


  document
    .getElementById("productDescription")
    .value =
      product.description || "";


  document
    .getElementById("formTitle")
    .textContent =
      "تعديل المنتج";


  document
    .getElementById("saveButton")
    .textContent =
      "حفظ التعديل";


  document
    .getElementById("cancelButton")
    .classList.remove("hidden");


  document
    .getElementById("imageHint")
    .textContent =
      " — اتركها فارغة للاحتفاظ بالصورة الحالية";


  document
    .getElementById("productImage")
    .value = "";


  document
    .getElementById("addStatus")
    .classList.remove("show");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

  resetForm();

  document
    .getElementById("addStatus")
    .classList.remove("show");
}


/* =========================
   RESET FORM
========================= */

function resetForm() {

  editingProductId = null;


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("productImage")
    .value = "";


  document
    .getElementById("formTitle")
    .textContent =
      "إضافة منتج";


  document
    .getElementById("saveButton")
    .textContent =
      "إضافة المنتج";


  document
    .getElementById("cancelButton")
    .classList.add("hidden");


  document
    .getElementById("imageHint")
    .textContent = "";
}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "هل تريد حذف هذا المنتج؟"
    )
  ) {
    return;
  }


  const result =
    await supabaseClient
      .from("Velora")
      .delete()
      .eq("id", id);


  if (result.error) {

    console.error(
      "Delete error:",
      result.error
    );

    alert(
      "حدث خطأ أثناء حذف المنتج."
    );

    return;
  }


  if (
    Number(editingProductId) === Number(id)
  ) {

    resetForm();

  }


  await loadProducts();


  showStatus(
    "addStatus",
    "تم حذف المنتج بنجاح ✅"
  );
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

checkLogin();

</script>

</body>
</html>
