<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VELORA | Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #171514;
      color: #fff;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      margin: 0;
      letter-spacing: 5px;
    }

    .logo p {
      color: #c9a96e;
    }

    .box {
      background: #211f1e;
      border: 1px solid #3b3633;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #4b4541;
      background: #171514;
      color: #fff;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .primary {
      width: 100%;
      margin-top: 20px;
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
    }

    .logout,
    .refresh,
    .cancel {
      background: #3b3633;
      color: #fff;
    }

    .edit {
      background: #c9a96e;
      color: #171514;
      font-weight: bold;
    }

    .delete {
      background: #6b2929;
      color: #fff;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #2b2725;
      display: none;
      line-height: 1.7;
    }

    .status.show {
      display: block;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .hint {
      color: #aaa;
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.6;
    }

    .hidden {
      display: none !important;
    }

    /* IMAGE PREVIEW */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #3b3633;
      background: #171514;
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .preview-item span {
      position: absolute;
      bottom: 5px;
      right: 5px;
      left: 5px;
      background: rgba(0,0,0,.65);
      border-radius: 6px;
      padding: 4px;
      font-size: 11px;
      text-align: center;
    }

    /* PRODUCTS */
    .product {
      border-top: 1px solid #3b3633;
      padding: 18px 0;
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .product:first-child {
      border-top: 0;
    }

    .product-main-image {
      width: 85px;
      height: 85px;
      object-fit: cover;
      border-radius: 12px;
      background: #171514;
      flex-shrink: 0;
    }

    .product-info {
      flex: 1;
      min-width: 180px;
    }

    .product-info h3 {
      margin: 0 0 6px;
    }

    .product-info p {
      margin: 4px 0;
      color: #c9a96e;
    }

    .product-info small {
      display: block;
      margin-top: 4px;
      color: #bbb;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .box {
        padding: 18px;
      }

      .product-actions {
        width: 100%;
      }

      .product-actions button {
        flex: 1;
      }

      .preview-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>VELORA</h1>
    <p>ADMIN PANEL</p>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="box">

    <h2>تسجيل دخول الإدارة</h2>

    <label>الإيميل</label>
    <input id="email" type="email" placeholder="admin@email.com">

    <label>كلمة المرور</label>
    <input id="password" type="password" placeholder="كلمة المرور">

    <button
      id="loginButton"
      class="primary"
      onclick="login()"
    >
      دخول
    </button>

    <div id="loginStatus" class="status"></div>
  </div>


  <!-- ADMIN -->
  <div id="adminPanel" class="hidden">

    <div class="box">

      <div class="top-bar">
        <h2 id="formTitle">إضافة منتج</h2>

        <button
          class="logout"
          onclick="logout()"
        >
          خروج
        </button>
      </div>


      <label>اسم المنتج</label>

      <input
        id="productName"
        type="text"
        placeholder="مثال: خاتم فاخر"
      >


      <label>السعر</label>

      <input
        id="productPrice"
        type="number"
        min="0"
        placeholder="280"
      >


      <label>القسم</label>

      <select id="productCategory">
        <option value="خواتم">خواتم</option>
        <option value="سلاسل">سلاسل</option>
        <option value="أساور">أساور</option>
        <option value="حلق">حلق</option>
      </select>


      <label>الوصف</label>

      <textarea
        id="productDescription"
        placeholder="اكتب وصف المنتج..."
      ></textarea>


      <label>الألوان المتاحة</label>

      <input
        id="productColors"
        type="text"
        placeholder="ذهبي, فضي, روز جولد"
      >

      <div class="hint">
        افصل كل لون بفاصلة.
      </div>


      <label>المقاسات المتاحة</label>

      <input
        id="productSizes"
        type="text"
        placeholder="6, 7, 8, 9"
      >

      <div class="hint">
        افصل كل مقاس بفاصلة. اتركه فارغًا لو المنتج بدون مقاس.
      </div>


      <label>صور المنتج</label>

      <input
        id="productImages"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
        onchange="previewImages(event)"
      >

      <div class="hint">
        يمكنك اختيار أكثر من صورة مرة واحدة. أول صورة ستكون الصورة الأساسية.
      </div>


      <div
        id="currentImagesHint"
        class="hint"
      ></div>


      <div
        id="imagePreview"
        class="preview-grid"
      ></div>


      <button
        id="saveButton"
        class="primary"
        onclick="saveProduct()"
      >
        إضافة المنتج
      </button>


      <button
        id="cancelButton"
        class="cancel hidden"
        onclick="cancelEdit()"
        style="width:100%;margin-top:10px;"
      >
        إلغاء التعديل
      </button>


      <div
        id="addStatus"
        class="status"
      ></div>

    </div>


    <!-- PRODUCTS LIST -->
    <div class="box">

      <div class="top-bar">
        <h2>المنتجات الحالية</h2>

        <button
          class="refresh"
          onclick="loadProducts()"
        >
          تحديث
        </button>
      </div>


      <div id="productsList">
        جاري التحميل...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nflcafxxjhinumvxyyxt.supabase.co";

const SUPABASE_KEY =
  "ضع نفس Publishable Key الموجود عندك";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let editingProductId = null;

let editingImages = [];

let selectedFiles = [];


/* =========================================================
   STATUS
========================================================= */

function showStatus(id, message) {

  const element =
    document.getElementById(id);

  if (!element) return;

  element.textContent =
    message;

  element.classList.add("show");
}


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const button =
    document.getElementById("loginButton");


  if (!email || !password) {

    showStatus(
      "loginStatus",
      "اكتب الإيميل وكلمة المرور."
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "جاري الدخول...";


  const result =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  button.disabled = false;

  button.textContent =
    "دخول";


  if (result.error) {

    console.error(result.error);

    showStatus(
      "loginStatus",
      "بيانات الدخول غير صحيحة."
    );

    return;
  }


  document
    .getElementById("loginBox")
    .classList.add("hidden");


  document
    .getElementById("adminPanel")
    .classList.remove("hidden");


  loadProducts();
}


/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();
}


/* =========================================================
   SESSION
========================================================= */

async function checkLogin() {

  const result =
    await supabaseClient.auth.getSession();


  if (
    result.data &&
    result.data.session
  ) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");


    document
      .getElementById("adminPanel")
      .classList.remove("hidden");


    loadProducts();
  }
}


/* =========================================================
   ARRAY HELPERS
========================================================= */

function textToArray(text) {

  return String(text || "")
    .split(",")
    .map(function(item) {
      return item.trim();
    })
    .filter(Boolean);
}


function arrayToText(value) {

  if (!Array.isArray(value)) {
    return "";
  }

  return value.join(", ");
}


function normalizeImages(value) {

  if (Array.isArray(value)) {
    return value.filter(Boolean);
  }

  return [];
}


/* =========================================================
   PREVIEW SELECTED IMAGES
========================================================= */

function previewImages(event) {

  selectedFiles =
    Array.from(
      event.target.files || []
    );


  const preview =
    document.getElementById(
      "imagePreview"
    );


  preview.innerHTML = "";


  selectedFiles.forEach(
    function(file, index) {

      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          preview.innerHTML += `

            <div class="preview-item">

              <img
                src="${e.target.result}"
                alt="صورة ${index + 1}"
              >

              <span>
                ${index === 0 ? "الصورة الأساسية" : "صورة إضافية"}
              </span>

            </div>

          `;
        };


      reader.readAsDataURL(file);
    }
  );
}


/* =========================================================
   UPLOAD IMAGES
========================================================= */

async function uploadImages(files) {

  const urls = [];


  for (
    const file of files
  ) {

    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9.-]/g,
        "-"
      );


    const fileName =
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .slice(2) +
      "-" +
      safeName;


    const upload =
      await supabaseClient
        .storage
        .from("products")
        .upload(
          fileName,
          file,
          {
            upsert: false
          }
        );


    if (upload.error) {

      throw upload.error;
    }


    const publicData =
      supabaseClient
        .storage
        .from("products")
        .getPublicUrl(
          fileName
        );


    urls.push(
      publicData.data.publicUrl
    );
  }


  return urls;
}


/* =========================================================
   SAVE PRODUCT
========================================================= */

async function saveProduct() {

  const name =
    document
      .getElementById("productName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );


  const category =
    document
      .getElementById("productCategory")
      .value;


  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();


  const colors =
    textToArray(
      document
        .getElementById("productColors")
        .value
    );


  const sizes =
    textToArray(
      document
        .getElementById("productSizes")
        .value
    );


  const button =
    document.getElementById(
      "saveButton"
    );


  if (
    !name ||
    !price ||
    !category
  ) {

    showStatus(
      "addStatus",
      "من فضلك املأ اسم المنتج والسعر والقسم."
    );

    return;
  }


  if (
    editingProductId === null &&
    !selectedFiles.length
  ) {

    showStatus(
      "addStatus",
      "اختر صورة واحدة على الأقل."
    );

    return;
  }


  button.disabled = true;


  button.textContent =
    editingProductId === null
      ? "جاري إضافة المنتج..."
      : "جاري حفظ التعديل...";


  try {

    let images = [];


    /* NEW PRODUCT */

    if (
      editingProductId === null
    ) {

      images =
        await uploadImages(
          selectedFiles
        );

    }


    /* EDIT PRODUCT */

    else {

      images =
        editingImages.slice();


      if (
        selectedFiles.length
      ) {

        const newImages =
          await uploadImages(
            selectedFiles
          );


        images =
          newImages;
      }

    }


    if (!images.length) {

      throw new Error(
        "لا توجد صور للمنتج."
      );
    }


    const primaryImage =
      images[0];


    /* UPDATE */

    if (
      editingProductId !== null
    ) {

      const result =
        await supabaseClient
          .from("Velora")
          .update({

            name: name,

            price: price,

            description:
              description,

            category: category,

            colors: colors,

            sizes: sizes,

            image:
              primaryImage,

            images:
              images

          })
          .eq(
            "id",
            editingProductId
          );


      if (result.error) {

        throw result.error;
      }


      showStatus(
        "addStatus",
        "تم تعديل المنتج بنجاح ✅"
      );

    }


    /* INSERT */

    else {

      const result =
        await supabaseClient
          .from("Velora")
          .insert({

            name: name,

            price: price,

            description:
              description,

            category: category,

            colors: colors,

            sizes: sizes,

            image:
              primaryImage,

            images:
              images

          });


      if (result.error) {

        throw result.error;
      }


      showStatus(
        "addStatus",
        "تم إضافة المنتج بنجاح ✅"
      );
    }


    resetForm();

    await loadProducts();


  } catch (error) {

    console.error(
      "Save error:",
      error
    );


    showStatus(
      "addStatus",
      "حدث خطأ أثناء حفظ المنتج."
    );

  }


  button.disabled = false;

  button.textContent =
    "إضافة المنتج";
}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

  const list =
    document.getElementById(
      "productsList"
    );


  if (!list) return;


  list.textContent =
    "جاري التحميل...";


  const result =
    await supabaseClient
      .from("Velora")
      .select("*")
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (result.error) {

    console.error(
      result.error
    );


    list.textContent =
      "حدث خطأ في تحميل المنتجات.";

    return;
  }


  const data =
    result.data || [];


  if (!data.length) {

    list.textContent =
      "لا توجد منتجات حاليًا.";

    return;
  }


  list.innerHTML =
    data.map(
      function(product) {

        const images =
          normalizeImages(
            product.images
          );


        const image =
          images[0] ||
          product.image ||
          "";


        return `

          <div class="product">

            <img
              class="product-main-image"
              src="${escapeHTML(image)}"
              alt="${escapeHTML(product.name || "")}"
            >


            <div class="product-info">

              <h3>
                ${escapeHTML(product.name || "")}
              </h3>

              <p>
                ${Number(product.price || 0)} جنيه
              </p>

              <small>
                القسم:
                ${escapeHTML(product.category || "")}
              </small>

              <small>
                الصور:
                ${images.length || (product.image ? 1 : 0)}
              </small>

            </div>


            <div class="product-actions">

              <button
                class="edit"
                onclick="editProduct(${product.id})"
              >
                ✏️ تعديل
              </button>


              <button
                class="delete"
                onclick="deleteProduct(${product.id})"
              >
                🗑️ حذف
              </button>

            </div>

          </div>

        `;
      }
    ).join("");
}


/* =========================================================
   EDIT
========================================================= */

async function editProduct(id) {

  const result =
    await supabaseClient
      .from("Velora")
      .select("*")
      .eq(
        "id",
        id
      )
      .single();


  if (
    result.error ||
    !result.data
  ) {

    alert(
      "تعذر تحميل المنتج."
    );

    return;
  }


  const product =
    result.data;


  editingProductId =
    product.id;


  editingImages =
    normalizeImages(
      product.images
    );


  if (
    !editingImages.length &&
    product.image
  ) {

    editingImages = [
      product.image
    ];
  }


  document
    .getElementById("productName")
    .value =
    product.name || "";


  document
    .getElementById("productPrice")
    .value =
    product.price || "";


  document
    .getElementById("productCategory")
    .value =
    product.category || "خواتم";


  document
    .getElementById("productDescription")
    .value =
    product.description || "";


  document
    .getElementById("productColors")
    .value =
    arrayToText(
      product.colors
    );


  document
    .getElementById("productSizes")
    .value =
    arrayToText(
      product.sizes
    );


  document
    .getElementById("productImages")
    .value =
    "";


  selectedFiles = [];


  document
    .getElementById("formTitle")
    .textContent =
    "تعديل المنتج";


  document
    .getElementById("saveButton")
    .textContent =
    "حفظ التعديل";


  document
    .getElementById("cancelButton")
    .classList.remove(
      "hidden"
    );


  document
    .getElementById("currentImagesHint")
    .textContent =
    editingImages.length
      ? "المنتج يحتوي على " +
        editingImages.length +
        " صورة. اختر صورًا جديدة لاستبدال المجموعة الحالية."
      : "";


  const preview =
    document.getElementById(
      "imagePreview"
    );


  preview.innerHTML =
    editingImages
      .map(function(image, index) {

        return `

          <div class="preview-item">

            <img
              src="${escapeHTML(image)}"
              alt="الصورة الحالية ${index + 1}"
            >

            <span>
              ${index === 0 ? "الصورة الأساسية" : "صورة إضافية"}
            </span>

          </div>

        `;

      }).join("");


  document
    .getElementById("addStatus")
    .classList.remove(
      "show"
    );


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm() {

  editingProductId =
    null;

  editingImages = [];

  selectedFiles = [];


  document
    .getElementById("productName")
    .value = "";


  document
    .getElementById("productPrice")
    .value = "";


  document
    .getElementById("productCategory")
    .value = "خواتم";


  document
    .getElementById("productDescription")
    .value = "";


  document
    .getElementById("productColors")
    .value = "";


  document
    .getElementById("productSizes")
    .value = "";


  document
    .getElementById("productImages")
    .value = "";


  document
    .getElementById("imagePreview")
    .innerHTML = "";


  document
    .getElementById("currentImagesHint")
    .textContent = "";


  document
    .getElementById("formTitle")
    .textContent =
    "إضافة منتج";


  document
    .getElementById("saveButton")
    .textContent =
    "إضافة المنتج";


  document
    .getElementById("cancelButton")
    .classList.add(
      "hidden"
    );
}


/* =========================================================
   CANCEL
========================================================= */

function cancelEdit() {

  resetForm();

  document
    .getElementById("addStatus")
    .classList.remove(
      "show"
    );
}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function deleteProduct(id) {

  if (
    !confirm(
      "هل تريد حذف هذا المنتج؟"
    )
  ) {
    return;
  }


  const result =
    await supabaseClient
      .from("Velora")
      .delete()
      .eq(
        "id",
        id
      );


  if (result.error) {

    console.error(
      result.error
    );

    alert(
      "حدث خطأ أثناء حذف المنتج."
    );

    return;
  }


  await loadProducts();


  showStatus(
    "addStatus",
    "تم حذف المنتج بنجاح ✅"
  );
}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   START
========================================================= */

checkLogin();

</script>

</body>
</html>
